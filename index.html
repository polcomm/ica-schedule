<title>ICA PolComm 2026 — Program</title>

<style>
  :root {
    --bg:#f5f3ee;--surface:#fff;--accent:#1a3a5c;--text:#1a1a1a;
    --muted:#6b6b6b;--border:#ddd9d0;
    --shadow-hover:0 8px 32px rgba(0,0,0,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  header{background:var(--accent);color:white;padding:28px 48px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.2)}
  .header-top{display:flex;align-items:baseline;gap:16px;margin-bottom:16px}
  header h1{font-family:'DM Serif Display',serif;font-size:1.8rem;letter-spacing:-0.5px}
  header p{font-size:0.85rem;opacity:0.7;letter-spacing:0.5px;text-transform:uppercase}

  /* TABS ROW */
  .all-tabs{display:flex;overflow-x:auto;border-top:1px solid rgba(255,255,255,0.1)}
  .tab{padding:12px 22px;cursor:pointer;font-size:0.85rem;font-weight:500;color:rgba(255,255,255,0.6);border-bottom:3px solid transparent;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
  .tab:hover{color:white}
  .tab.active{color:white;border-bottom-color:#e8d5b7}
  .tab-divider{width:1px;background:rgba(255,255,255,0.15);margin:8px 0;flex-shrink:0}

  /* SEARCH (only shown on day views) */
  .search-bar{padding:20px 48px;background:var(--surface);border-bottom:1px solid var(--border)}
  .search-input{width:100%;max-width:600px;padding:10px 16px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;background:var(--bg);outline:none;transition:border-color 0.2s}
  .search-input:focus{border-color:var(--accent)}

  /* OVERVIEW PAGE */
  #overviewPage{display:block}
  #overviewPage .canva-wrap{position:relative;width:100%;max-width:900px;margin:32px auto;padding:0 48px}
  #overviewPage .canva-embed{position:relative;width:100%;height:0;padding-top:100%;box-shadow:0 2px 12px rgba(63,69,81,0.16);border-radius:12px;overflow:hidden}
  #overviewPage .canva-embed iframe{position:absolute;width:100%;height:100%;top:0;left:0;border:none}
  #overviewPage .canva-caption{text-align:center;margin-top:12px;font-size:0.82rem;color:var(--muted)}
  #overviewPage .canva-caption a{color:var(--accent);text-decoration:none}
  #overviewPage .canva-caption a:hover{text-decoration:underline}

  /* SCHEDULE PAGE */
  #schedulePage{display:none}
  .main{padding:0 48px 48px;max-width:1400px}

  .timeslot-group{margin-top:32px}
  .timeslot-label{font-size:0.78rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:16px 0 12px;border-top:2px solid var(--border);display:flex;align-items:center;gap:12px}
  .timeslot-label::after{content:'';flex:1;height:1px;background:var(--border)}

  .sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

  .session-card{background:var(--surface);border-radius:12px;padding:20px;cursor:pointer;border:1.5px solid var(--border);transition:all 0.2s ease;position:relative;overflow:hidden}
  .session-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:4px 0 0 4px}
  .session-card.hd::before{background:#e67e22}
  .session-card.panel::before{background:#2980b9}
  .session-card.event::before{background:#8e44ad}
  .session-card:hover{box-shadow:var(--shadow-hover);border-color:var(--accent);transform:translateY(-2px)}

  .session-type-badge{display:inline-block;font-size:0.68rem;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-bottom:10px}
  .badge-paper{background:#e8f4e8;color:#2d7a2d}
  .badge-panel{background:#e8eef8;color:#1a4a8a}
  .badge-hd{background:#fdf3e3;color:#8a5a00}
  .badge-event{background:#f3e8f8;color:#6a1a8a}

  .session-title{font-family:'DM Serif Display',serif;font-size:1.05rem;line-height:1.35;margin-bottom:10px}
  .session-meta{font-size:0.75rem;color:var(--muted);margin-top:12px}
  .paper-count{font-size:0.75rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 0.25s;backdrop-filter:blur(4px)}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);transform:translateY(20px);transition:transform 0.25s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-header{position:sticky;top:0;background:var(--accent);color:white;padding:24px 28px 20px;border-radius:16px 16px 0 0}
  .modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:rgba(255,255,255,0.7);font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:4px;transition:all 0.2s;line-height:1}
  .modal-close:hover{color:white;background:rgba(255,255,255,0.15)}
  .modal-session-type{font-size:0.72rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:0.7;margin-bottom:8px}
  .modal-title{font-family:'DM Serif Display',serif;font-size:1.4rem;line-height:1.25;margin-bottom:12px}
  .modal-info{display:flex;flex-wrap:wrap;gap:12px;font-size:0.8rem;opacity:0.85}
  .modal-body{padding:24px 28px}
  .chairs-section{background:var(--bg);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.85rem;color:var(--muted);line-height:1.5}
  .papers-list{display:flex;flex-direction:column}
  .paper-item{padding:16px 0;border-bottom:1px solid var(--border)}
  .paper-item:last-child{border-bottom:none}
  .paper-number{font-size:0.7rem;font-weight:700;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
  .paper-title{font-size:0.95rem;font-weight:500;line-height:1.45;margin-bottom:6px}
  .paper-authors{font-size:0.82rem;color:var(--muted);line-height:1.9}
  .author-presenter{color:var(--accent);font-weight:600;font-style:italic}
  .presenter-tag{display:inline-block;font-size:0.6rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:var(--accent);color:white;padding:1px 5px;border-radius:3px;margin-left:3px;vertical-align:middle;position:relative;top:-1px;font-style:normal}
  .author-sep{color:#ccc;margin:0 3px}
  .empty-state{text-align:center;padding:64px;color:var(--muted);font-size:0.95rem}

  @media(max-width:768px){
    header{padding:20px 20px 0}
    .search-bar{padding:16px 20px}
    .main{padding:0 20px 32px}
    .sessions-grid{grid-template-columns:1fr}
    #overviewPage .canva-wrap{padding:0 20px}
  }
</style>
</head>

let currentView = 'overview';
let currentDate = '2026-06-05';
let searchQuery = '';

const dayLabels = {
  '2026-06-05': 'Friday, June 5',
  '2026-06-06': 'Saturday, June 6',
  '2026-06-07': 'Sunday, June 7',
  '2026-06-08': 'Monday, June 8'
};

function formatTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h > 12 ? h - 12 : h === 0 ? 12 : h;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function getTypeInfo(title, stype) {
  const t = (title || '').toUpperCase();
  const st = (stype || '').toUpperCase();
  if (t.includes('HIGH-DENSITY') || t.includes('HIGH DENSITY'))
    return { cls:'hd', badge:'badge-hd', label:'High-Density' };
  if (st.includes('PANEL') || st.includes('ROUNDTABLE') || st.includes('ESCALATOR'))
    return { cls:'panel', badge:'badge-panel', label:'Panel' };
  if (st.includes('BUSINESS') || st.includes('RECEPTION') || st.includes('POSTER'))
    return { cls:'event', badge:'badge-event', label: st.includes('RECEPTION') ? 'Reception' : st.includes('BUSINESS') ? 'Business Meeting' : 'Poster Session' };
  return { cls:'', badge:'badge-paper', label:'Paper Session' };
}

function renderAuthors(authorsStr, presenterLast) {
  if (!authorsStr) return '';
  const parts = authorsStr.split(';').map(s => s.trim()).filter(Boolean);
  const presLast = (presenterLast || '').toLowerCase().trim();
  const rendered = parts.map(name => {
    const words = name.trim().split(' ');
    const lastWord = words[words.length - 1].toLowerCase().replace(/[^a-z\-]/g, '');
    const isPresenter = presLast && (lastWord === presLast || presLast.includes(lastWord) || lastWord.includes(presLast));
    if (isPresenter) return `<span class="author-presenter">${name}<span class="presenter-tag">presenting</span></span>`;
    return `<span>${name}</span>`;
  });
  return rendered.join('<span class="author-sep">·</span>');
}

function switchView(view, date) {
  currentView = view;
  // Update tab highlights
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (view === 'overview') {
    document.querySelector('.tab[data-view="overview"]').classList.add('active');
    document.getElementById('overviewPage').style.display = 'block';
    document.getElementById('schedulePage').style.display = 'none';
  } else {
    currentDate = date;
    document.querySelector(`.tab[data-date="${date}"]`).classList.add('active');
    document.getElementById('overviewPage').style.display = 'none';
    document.getElementById('schedulePage').style.display = 'block';
    renderSchedule();
  }
}

function renderSchedule() {
  const container = document.getElementById('mainContent');
  let filtered;

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = sessions.filter(s =>
      s.title.toLowerCase().includes(q) ||
      (s.chairs || '').toLowerCase().includes(q) ||
      s.papers.some(p => p.title.toLowerCase().includes(q) || (p.authors||'').toLowerCase().includes(q))
    );
  } else {
    filtered = sessions.filter(s => s.date === currentDate);
  }

  if (!filtered.length) {
    container.innerHTML = '<div class="empty-state">No sessions found.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(s => {
    const k = s.start + '|' + s.end;
    if (!groups[k]) groups[k] = [];
    groups[k].push(s);
  });

  let html = '';
  Object.keys(groups).sort().forEach(k => {
    const [start, end] = k.split('|');
    html += `<div class="timeslot-group">
      <div class="timeslot-label">${formatTime(start)} – ${formatTime(end)}</div>
      <div class="sessions-grid">`;
    groups[k].forEach(s => {
      const ti = getTypeInfo(s.title, s.type);
      const idx = sessions.indexOf(s);
      const cnt = s.papers.length;
      html += `<div class="session-card ${ti.cls}" onclick="openModal(${idx})">
        <div class="session-type-badge ${ti.badge}">${ti.label}</div>
        <div class="session-title">${s.title}</div>
        <div class="session-meta">📍 ${s.location}</div>
        ${cnt ? `<div class="paper-count">${cnt} paper${cnt!==1?'s':''}</div>` : ''}
      </div>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function openModal(idx) {
  const s = sessions[idx];
  const ti = getTypeInfo(s.title, s.type);
  document.getElementById('modalType').textContent = ti.label;
  document.getElementById('modalTitle').textContent = s.title;
  document.getElementById('modalInfo').innerHTML =
    `<span>🕐 ${formatTime(s.start)} – ${formatTime(s.end)}</span>
     <span>📍 ${s.location}</span>
     <span>📅 ${dayLabels[s.date]||s.date}</span>`;

  let body = '';
  if (s.chairs && s.chairs !== 'nan') body += `<div class="chairs-section">${s.chairs}</div>`;
  if (s.papers.length) {
    body += '<div class="papers-list">';
    s.papers.forEach((p, i) => {
      body += `<div class="paper-item">
        <div class="paper-number">Paper ${i+1}</div>
        <div class="paper-title">${p.title}</div>
        <div class="paper-authors">${renderAuthors(p.authors, p.presenter_last)}</div>
      </div>`;
    });
    body += '</div>';
  } else {
    body += '<p style="color:var(--muted);font-size:0.9rem">No papers listed for this session.</p>';
  }
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
}

// Tab clicks
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const view = tab.dataset.view;
    const date = tab.dataset.date || '';
    // If switching to a day tab while search is active, clear search
    if (view === 'day') {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
    }
    switchView(view, date);
  });
});

// Search — only relevant on day views
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  if (searchQuery && currentView === 'overview') {
    // Auto-switch to first day when searching from overview
    switchView('day', '2026-06-05');
    return;
  }
  renderSchedule();
});

// Modal close
document.getElementById('modalClose').addEventListener('click', () =>
  document.getElementById('modalOverlay').classList.remove('open'));
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
});
</script>
